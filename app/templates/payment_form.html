{% extends "base.html" %}

{% block title %}{{ action }} Payment - Subscription Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('payments.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    Back to Payments
</a>

<div class="page-header">
    <h1>{{ action }} Payment</h1>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="subscription_id">Subscription *</label>
                    <select id="subscription_id" name="subscription_id" required>
                        <option value="">Select Subscription</option>
                        {% for sub in subscriptions %}
                        <option value="{{ sub.id }}" data-amount="{{ sub.amount }}" data-currency="{{ sub.currency }}"
                            data-payment-method-id="{{ sub.payment_method_id or '' }}"
                            data-next-due-date="{{ sub.next_due_date.isoformat() if sub.next_due_date else '' }}">
                            {{ sub.name }} ({{ {'TRY': '₺', 'USD': '$', 'EUR': '€'}[sub.currency] }}{{
                            "%.2f"|format(sub.amount) }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="payment_method_id">Payment Method</label>
                    <select id="payment_method_id" name="payment_method_id">
                        <option value="">No Payment Method</option>
                        {% for pm in payment_methods %}
                        <option value="{{ pm.id }}" {% if pm.is_default %}selected{% endif %}>
                            {{ pm.display_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount Paid *</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="original_amount">Original Amount (for discount)</label>
                    <input type="number" id="original_amount" name="original_amount" step="0.01" min="0"
                        placeholder="Leave empty if no discount">
                </div>

                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" name="currency">
                        <option value="TRY">TRY (₺)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="paid_date">Payment Date *</label>
                    <input type="date" id="paid_date" name="paid_date" required value="{{ today }}">
                </div>

                <div class="form-group full-width">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" placeholder="Additional notes..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    Record Payment
                </button>
                <a href="{{ url_for('payments.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Auto-fill form fields when subscription is selected
    document.getElementById('subscription_id').addEventListener('change', function () {
        const option = this.options[this.selectedIndex];
        if (option.value) {
            // Fill amount and currency
            document.getElementById('amount').value = option.dataset.amount;
            document.getElementById('original_amount').value = option.dataset.amount;
            document.getElementById('currency').value = option.dataset.currency;

            // Fill payment method if subscription has one
            const paymentMethodId = option.dataset.paymentMethodId;
            if (paymentMethodId) {
                document.getElementById('payment_method_id').value = paymentMethodId;
            }

            // Fill payment date with subscription's next due date
            const nextDueDate = option.dataset.nextDueDate;
            if (nextDueDate) {
                document.getElementById('paid_date').value = nextDueDate;
            }
        }
    });
</script>
{% endblock %}
