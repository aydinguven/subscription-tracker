{% extends "base.html" %}

{% block title %}Export Data - SubTracker{% endblock %}

{% block content %}
<a href="{{ url_for('dashboard.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    <span>Back to Dashboard</span>
</a>

<div class="page-header">
    <div>
        <h1>Export Data</h1>
        <p class="page-subtitle">Download your subscriptions, payments, and categories</p>
    </div>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form" hx-boost="false">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="format">Export File Format</label>
                <select id="format" name="format" class="form-control">
                    <option value="json">JSON Backup (.json) - Recommended for Full Restores</option>
                    <option value="excel">Excel Spreadsheet (.xlsx) - Multi-sheet Workbook</option>
                    <option value="csv">CSV Spreadsheet (.csv) - Subscriptions Flat File</option>
                </select>
            </div>

            <div class="export-options">
                <label class="checkbox-card">
                    <input type="checkbox" name="categories" checked>
                    <div class="checkbox-card-content">
                        <i data-lucide="tags"></i>
                        <span class="checkbox-card-title">Categories</span>
                        <span class="checkbox-card-count">{{ stats.categories }} items</span>
                    </div>
                </label>

                <label class="checkbox-card">
                    <input type="checkbox" name="payment_methods" checked>
                    <div class="checkbox-card-content">
                        <i data-lucide="landmark"></i>
                        <span class="checkbox-card-title">Payment Methods</span>
                        <span class="checkbox-card-count">{{ stats.payment_methods }} items</span>
                    </div>
                </label>

                <label class="checkbox-card">
                    <input type="checkbox" name="subscriptions" checked>
                    <div class="checkbox-card-content">
                        <i data-lucide="repeat"></i>
                        <span class="checkbox-card-title">Subscriptions</span>
                        <span class="checkbox-card-count">{{ stats.subscriptions }} items</span>
                    </div>
                </label>

                <label class="checkbox-card">
                    <input type="checkbox" name="payments" checked>
                    <div class="checkbox-card-content">
                        <i data-lucide="credit-card"></i>
                        <span class="checkbox-card-title">Payments</span>
                        <span class="checkbox-card-count">{{ stats.payments }} items</span>
                    </div>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="download"></i>
                    <span>Download Export File</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
