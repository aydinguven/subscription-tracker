{% extends "base.html" %}

{% block title %}{{ action }} Category - Subscription Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('categories.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    Back to Categories
</a>

<div class="page-header">
    <h1>{{ action }} Category</h1>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required value="{{ category.name if category else '' }}"
                        placeholder="e.g., Streaming">
                </div>

                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="color" id="color" name="color" value="{{ category.color if category else '#6b7280' }}"
                        class="color-input">
                </div>

                <div class="form-group">
                    <label for="icon">Icon</label>
                    <select id="icon" name="icon">
                        {% set icons = ['tv', 'film', 'music', 'gamepad-2', 'cloud', 'code', 'server', 'database',
                        'shield', 'zap', 'wifi', 'phone', 'mail', 'book', 'newspaper', 'briefcase', 'home', 'car',
                        'plane', 'shopping-cart', 'heart', 'star', 'box', 'folder', 'tags'] %}
                        {% for icon in icons %}
                        <option value="{{ icon }}" {% if category and category.icon==icon %}selected{% elif not category
                            and icon=='folder' %}selected{% endif %}>
                            {{ icon|replace('-', ' ')|title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    {{ action }} Category
                </button>
                <a href="{{ url_for('categories.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
