{% extends "base.html" %}

{% block title %}{{ action }} Category - SubTracker{% endblock %}

{% block content %}
<a href="{{ url_for('categories.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    <span>Back to Categories</span>
</a>

<div class="page-header">
    <div>
        <h1>{{ action }} Category</h1>
        <p class="page-subtitle">Organize your expenses and subscriptions</p>
    </div>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Category Name *</label>
                    <input type="text" id="name" name="name" required class="form-control"
                        value="{{ category.name if category else '' }}" placeholder="e.g. Streaming, Software, Utilities">
                </div>

                <div class="form-group">
                    <label for="color">Badge Color</label>
                    <input type="color" id="color" name="color" value="{{ category.color if category else '#6366f1' }}" class="color-input">
                </div>

                <div class="form-group">
                    <label for="icon">Category Icon</label>
                    <select id="icon" name="icon" class="form-control">
                        {% set icons = ['tv', 'film', 'music', 'gamepad-2', 'cloud', 'code', 'server', 'database',
                        'shield', 'zap', 'wifi', 'phone', 'mail', 'book', 'newspaper', 'briefcase', 'home', 'car',
                        'plane', 'shopping-cart', 'heart', 'star', 'box', 'folder', 'tags'] %}
                        {% for icon in icons %}
                        <option value="{{ icon }}" {% if category and category.icon==icon %}selected{% elif not category and icon=='box' %}selected{% endif %}>
                            {{ icon|replace('-', ' ')|title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    <span>{{ action }} Category</span>
                </button>
                <a href="{{ url_for('categories.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
