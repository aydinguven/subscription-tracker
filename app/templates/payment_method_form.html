{% extends "base.html" %}

{% block title %}{{ action }} Payment Method - Subscription Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('payment_methods.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    Back to Payment Methods
</a>

<div class="page-header">
    <h1>{{ action }} Payment Method</h1>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required value="{{ method.name if method else '' }}"
                        placeholder="e.g., My Bank Account">
                </div>

                <div class="form-group">
                    <label for="method_type">Type *</label>
                    <select id="method_type" name="method_type" required>
                        {% for type_id, type_name, type_icon in method_types %}
                        <option value="{{ type_id }}" {% if method and method.method_type==type_id %}selected{% endif
                            %}>
                            {{ type_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="identifier">Identifier (optional)</label>
                    <input type="text" id="identifier" name="identifier"
                        value="{{ method.identifier if method else '' }}" placeholder="e.g., •••• 9365">
                </div>

                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="color" id="color" name="color" value="{{ method.color if method else '#6b7280' }}"
                        class="color-input">
                </div>

                <div class="form-group">
                    <label for="icon">Icon</label>
                    <select id="icon" name="icon">
                        {% set icons = ['credit-card', 'landmark', 'wallet', 'smartphone', 'banknote', 'coins',
                        'building', 'piggy-bank'] %}
                        {% for icon in icons %}
                        <option value="{{ icon }}" {% if method and method.icon==icon %}selected{% elif not method and
                            icon=='credit-card' %}selected{% endif %}>
                            {{ icon|replace('-', ' ')|title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_default" {% if method and method.is_default %}checked{% endif
                            %}>
                        <span>Set as default payment method</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    {{ action }} Payment Method
                </button>
                <a href="{{ url_for('payment_methods.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
