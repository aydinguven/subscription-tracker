{% extends "base.html" %}

{% block title %}{{ action }} Payment Method - SubTracker{% endblock %}

{% block content %}
<a href="{{ url_for('payment_methods.index') }}" class="back-link">
    <i data-lucide="arrow-left"></i>
    <span>Back to Payment Methods</span>
</a>

<div class="page-header">
    <div>
        <h1>{{ action }} Payment Method</h1>
        <p class="page-subtitle">Track which cards, banks, or accounts are charged</p>
    </div>
</div>

<div class="card form-card">
    <div class="card-body">
        <form method="POST" class="form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Account / Card Name *</label>
                    <input type="text" id="name" name="name" required class="form-control"
                        value="{{ method.name if method else '' }}" placeholder="e.g. Chase Sapphire, Papara, Main Checking">
                </div>

                <div class="form-group">
                    <label for="method_type">Account Type *</label>
                    <select id="method_type" name="method_type" required class="form-control">
                        {% for type_id, type_name, type_icon in method_types %}
                        <option value="{{ type_id }}" {% if method and method.method_type==type_id %}selected{% endif %}>
                            {{ type_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="identifier">Identifier (Optional)</label>
                    <input type="text" id="identifier" name="identifier" class="form-control"
                        value="{{ method.identifier if method else '' }}" placeholder="e.g. •••• 9365 or IBAN last 4">
                </div>

                <div class="form-group">
                    <label for="color">Badge Color</label>
                    <input type="color" id="color" name="color" value="{{ method.color if method else '#6366f1' }}" class="color-input">
                </div>

                <div class="form-group">
                    <label for="icon">Icon</label>
                    <select id="icon" name="icon" class="form-control">
                        {% set icons = ['credit-card', 'landmark', 'wallet', 'smartphone', 'banknote', 'coins', 'building', 'piggy-bank'] %}
                        {% for icon in icons %}
                        <option value="{{ icon }}" {% if method and method.icon==icon %}selected{% elif not method and icon=='credit-card' %}selected{% endif %}>
                            {{ icon|replace('-', ' ')|title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group checkbox-group full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_default" {% if method and method.is_default %}checked{% endif %}>
                        <span>Set as default payment method</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    <span>{{ action }} Payment Method</span>
                </button>
                <a href="{{ url_for('payment_methods.index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
