<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - SubTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i data-lucide="wallet"></i>
                    <span>SubTracker</span>
                </div>
                <p class="login-subtitle">Sign in to manage your recurring expenses</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="alerts-container" style="margin-bottom: 1.25rem;">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <i data-lucide="{% if category == 'error' %}alert-circle{% else %}info{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="username">
                        <i data-lucide="user" style="width: 14px; height: 14px; display: inline; vertical-align: middle;"></i>
                        Username
                    </label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter your username" class="form-control">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i data-lucide="lock" style="width: 14px; height: 14px; display: inline; vertical-align: middle;"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary login-btn">
                    <i data-lucide="log-in"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
